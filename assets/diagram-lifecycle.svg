<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-label="Secretary run lifecycle: task file to prepared snapshot to isolated child model to local validation, halting at needs approval before any typed action adapter.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171B"/>
      <stop offset="1" stop-color="#0E1013"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C2432"/>
    </marker>
    <marker id="arwGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E0C173"/>
    </marker>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>

  <text x="80" y="86" font-family="Georgia, 'Iowan Old Style', serif" font-size="42" fill="#EFEDE7">Run lifecycle</text>
  <g>
    <line x1="80" y1="112" x2="380" y2="112" stroke="#8C2432" stroke-width="1"/>
    <circle cx="230" cy="112" r="3.5" fill="#E0C173"/>
  </g>
  <text x="80" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7C8290">Every transition is a typed write. Nothing is handed over in memory.</text>

  <!-- main chain -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- 1 -->
    <rect x="80" y="216" width="232" height="92" rx="6" fill="#1C1F25" stroke="#3A3E47" stroke-width="1"/>
    <text x="98" y="246" font-size="12" fill="#E0C173">01</text>
    <text x="98" y="272" font-size="16" fill="#EFEDE7">task file + run ID</text>
    <text x="98" y="294" font-size="12" fill="#7C8290">no inline task text</text>

    <line x1="312" y1="262" x2="368" y2="262" stroke="#8C2432" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- 2 -->
    <rect x="376" y="216" width="232" height="92" rx="6" fill="#1C1F25" stroke="#3A3E47" stroke-width="1"/>
    <text x="394" y="246" font-size="12" fill="#E0C173">02</text>
    <text x="394" y="272" font-size="16" fill="#EFEDE7">prepare</text>
    <text x="394" y="294" font-size="12" fill="#7C8290">frozen snapshot, hashed</text>

    <line x1="608" y1="262" x2="664" y2="262" stroke="#8C2432" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- 3 -->
    <rect x="672" y="216" width="232" height="92" rx="6" fill="#1C1F25" stroke="#8C2432" stroke-width="1.4"/>
    <text x="690" y="246" font-size="12" fill="#E0C173">03</text>
    <text x="690" y="272" font-size="16" fill="#EFEDE7">isolated child</text>
    <text x="690" y="294" font-size="12" fill="#7C8290">Claude Code or Codex</text>

    <line x1="904" y1="262" x2="960" y2="262" stroke="#8C2432" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- 4 -->
    <rect x="968" y="216" width="232" height="92" rx="6" fill="#1C1F25" stroke="#3A3E47" stroke-width="1"/>
    <text x="986" y="246" font-size="12" fill="#E0C173">04</text>
    <text x="986" y="272" font-size="16" fill="#EFEDE7">local validation</text>
    <text x="986" y="294" font-size="12" fill="#7C8290">fail closed</text>

    <line x1="1200" y1="262" x2="1256" y2="262" stroke="#8C2432" stroke-width="1.6" marker-end="url(#arw)"/>

    <!-- 5 -->
    <rect x="1264" y="216" width="232" height="92" rx="6" fill="#1C1F25" stroke="#3A3E47" stroke-width="1"/>
    <text x="1282" y="246" font-size="12" fill="#E0C173">05</text>
    <text x="1282" y="272" font-size="16" fill="#EFEDE7">result</text>
    <text x="1282" y="294" font-size="12" fill="#7C8290">schema bound</text>
  </g>

  <!-- the halt branch, the load-bearing part -->
  <path d="M1084 308 L1084 384" stroke="#E0C173" stroke-width="1.6" fill="none" marker-end="url(#arwGold)"/>
  <text x="1098" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E0C173">action requested</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="852" y="392" width="464" height="88" rx="6" fill="#241C1E" stroke="#8C2432" stroke-width="1.4"/>
    <text x="874" y="424" font-size="16" fill="#EFEDE7">needs_approval &#183; halt</text>
    <text x="874" y="450" font-size="12" fill="#B9BDC6">a non-interactive model cannot approve itself</text>
    <text x="874" y="468" font-size="12" fill="#7C8290">human approves in an interactive session</text>

    <line x1="1316" y1="436" x2="1372" y2="436" stroke="#E0C173" stroke-width="1.6" marker-end="url(#arwGold)"/>

    <rect x="1380" y="392" width="140" height="88" rx="6" fill="#1C1F25" stroke="#3A3E47" stroke-width="1"/>
    <text x="1398" y="428" font-size="14" fill="#EFEDE7">typed</text>
    <text x="1398" y="448" font-size="14" fill="#EFEDE7">adapter</text>
    <text x="1398" y="468" font-size="11" fill="#7C8290">no shell</text>
  </g>

  <text x="80" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2" fill="#565C69">JUDGMENT HIGH &#183; AUTHORITY ZERO</text>
</svg>
