name: Feature request
description: Propose a focused capability with explicit authority boundaries.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is currently blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful capability.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority and side effects
      description: Identify reads, writes, external calls, accounts, permissions, spending, publication, and rollback.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Name observable success criteria and negative controls.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why existing profiles, brain notes, or adapters are insufficient.
